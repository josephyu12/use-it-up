[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "useitup"
version = "0.1.0"
description = "An Explainable Recipe Recommendation System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
webapp = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
local = [
    "uvicorn[standard]>=0.27",
]
notebook = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
    "jupyter>=1.0",
]
data = [
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/useitup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
